{% extends "base.html" %}
{% block main_class %}report-page{% endblock %}
{% block main %}
<div class="report-toolbar no-print">
  <a href="{{ view.back_href }}">← 返回工作台</a>
  <div class="head-actions">
    <button type="button" data-print>打印 / 保存为 PDF</button>
    {% if view.json_href %}<a class="button button-secondary button-small" href="{{ view.json_href }}">下载附加 JSON</a>{% endif %}
    <a href="/">返回首页</a>
  </div>
</div>
{% with report = view %}
  {% include "report_content.html" %}
{% endwith %}
{% endblock %}
