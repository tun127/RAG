[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag"
version = "1.0.0"
description = "Contract review demo with evidence retrieval and LangGraph review"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "ollama>=0.6.3,<0.7", "pymilvus>=2.5.18,<2.6",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "rank-bm25==0.2.2", "httpx>=0.28,<0.29",
  "pypdf>=7,<8", "defusedxml>=0.7.1,<1",
  "jinja2>=3.1.6,<4", "python-multipart>=0.0.22,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
cache = ["redis>=5,<7"]
contract-pilot = ["pypdf>=6,<8"]
contract-e2e = ["langgraph==1.2.20"]

[project.scripts]
rag = "production_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
production_rag = ["api/templates/*.html"]
"production_rag.product_ui" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
